<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的多元計程車營運總覽</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;font-family:system-ui;background:#0b1220;color:#eef2f7}.hidden{display:none!important}.wrap{max-width:1320px;margin:auto;padding:18px}.login{max-width:430px;margin:11vh auto;padding:26px;background:#131c2e;border:1px solid #2b3850;border-radius:20px}.login input,.login button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin:8px 0}.login input{background:#0f172a;color:white;border:1px solid #2b3850}.login button{border:0;font-weight:800;cursor:pointer}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#064e3b}.err{background:#7f1d1d}.muted{color:#93a4ba;font-size:12px}header{border-bottom:1px solid #2b3850;background:#101827}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav button,.logout{padding:9px 13px;border:1px solid #2b3850;border-radius:10px;background:#0f172a;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.card{background:#131c2e;border:1px solid #2b3850;border-radius:16px;padding:16px}.label{font-size:12px;color:#93a4ba}.value{font-size:25px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto;margin-top:18px;border:1px solid #2b3850;border-radius:14px}.table{width:100%;border-collapse:separate;border-spacing:0}.table th,.table td{padding:14px 16px;border-bottom:1px solid #2b3850;white-space:nowrap;text-align:left;line-height:1.45}.table th{background:#172238}.table tbody tr:nth-child(odd){background:#111b2d}.table tbody tr:nth-child(even){background:#18243a}.table tbody tr:hover{background:#243552}.table td:last-child{white-space:normal;min-width:260px}.chartbox{margin-top:18px;background:#131c2e;border:1px solid #2b3850;border-radius:16px;padding:16px;height:320px}.status{margin-top:14px;padding:12px;border:1px solid #2b3850;border-radius:12px;background:#111827}</style></head><body><div id="loginPanel" class="login hidden"><h2>🚕 我的多元計程車營運總覽</h2><p class="muted">登入後才能查看私人營運資料</p><input id="emailInput" type="email" value="ac960322@gmail.com"><button id="magicBtn" type="button">寄送登入連結</button><div id="loginMsg"></div></div><div id="loadingPanel" class="login"><h2>🚕 我的多元計程車營運總覽</h2><div class="status">正在確認登入狀態…</div></div><div id="appPanel" class="hidden"><header><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>🚕 我的多元計程車營運總覽</b><div class="muted">私人帳本・正式 Supabase</div></div><button id="logoutBtn" class="logout">登出</button></div><div class="nav"><button data-tab="dashboard">儀表板</button><button data-tab="daily">每日紀錄</button><button data-tab="expenses">車輛支出</button><button data-tab="monthly">月度損益</button></div></div></header><main class="wrap"><div id="dataStatus" class="status">正在讀取營運資料…</div><section id="dashboard" class="hidden"><div class="grid"><div class="card"><div class="label">最新總實收</div><div id="latestRevenue" class="value">—</div></div><div class="card"><div class="label">最新淨收入</div><div id="latestNet" class="value">—</div></div><div class="card"><div class="label">最新淨時薪</div><div id="latestHourly" class="value">—</div></div><div class="card"><div class="label">最新單數</div><div id="latestTrips" class="value">—</div></div><div class="card"><div class="label">最新里程</div><div id="latestKm" class="value">—</div></div><div class="card"><div class="label">最新油耗</div><div id="latestFuel" class="value">—</div></div></div><div class="chartbox"><canvas id="revenueChart"></canvas></div></section><section id="daily" class="hidden"><h3>每日營運紀錄</h3><div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>日別</th><th>時間</th><th>總實收</th><th>單數</th><th>里程</th><th>油耗</th><th>淨收入</th><th>淨時薪</th><th>備註</th></tr></thead><tbody id="dailyBody"></tbody></table></div></section><section id="expenses" class="hidden"><h3>車輛支出</h3><div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>類別</th><th>實付</th><th>公升</th><th>單價</th><th>里程</th><th>備註</th></tr></thead><tbody id="expenseBody"></tbody></table></div></section><section id="monthly" class="hidden"><h3>月度損益</h3><div class="chartbox"><canvas id="monthlyChart"></canvas></div><div id="monthlyBody" class="grid"></div></section></main></div><script>(()=>{'use strict';const URL='https://drtcwtexgpfliafozoel.supabase.co';const KEY='sb_publishable_QUlgRpzRqe-5GLzFLfi4iw_M4w2U0Wj';const OWNER='ac960322@gmail.com';const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const money=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(v||0));const n=v=>Number(v||0);let chart1,chart2,loading=false;function showTab(id){['dashboard','daily','expenses','monthly'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='monthly'&&chart2)chart2.resize()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));$('magicBtn').addEventListener('click',async()=>{const email=$('emailInput').value.trim();const m=$('loginMsg');if(email!==OWNER){m.className='msg err';m.textContent='此網站只允許指定帳號登入';return}const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});m.className='msg '+(error?'err':'ok');m.textContent=error?'寄送失敗：'+error.message:'登入信已寄出，請到 Gmail 點最新登入連結。'});$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});async function requireSession(){let {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session)return null;if(!session.access_token){const r=await sb.auth.refreshSession();if(r.error)throw r.error;session=r.data.session}return session}async function loadData(session){if(loading)return;loading=true;$('dataStatus').classList.remove('hidden');$('dataStatus').textContent='已確認登入，正在讀取營運資料…';try{const {data:{user},error:userErr}=await sb.auth.getUser();if(userErr||!user||user.email!==OWNER)throw new Error('登入狀態已失效，請重新登入');const [oq,eq,fq,rq]=await Promise.all([sb.from('daily_operations').select('*').order('op_date',{ascending:true}),sb.from('vehicle_expenses').select('*').order('expense_date',{ascending:false}),sb.from('fixed_costs').select('*').order('id'),sb.from('monthly_reconciliation').select('*').order('month')]);const err=oq.error||eq.error||fq.error||rq.error;if(err)throw err;const ops=oq.data||[],exp=eq.data||[],fixed=fq.data||[],recon=rq.data||[];const latest=ops.at(-1);if(latest){$('latestRevenue').textContent=money(latest.total_cash_revenue);$('latestNet').textContent=latest.operating_net_income==null?'—':money(latest.operating_net_income);$('latestHourly').textContent=latest.net_hourly==null?'—':money(latest.net_hourly)+'/hr';$('latestTrips').textContent=(n(latest.platform_trips)+n(latest.non_platform_trips))+' 趟';$('latestKm').textContent=n(latest.business_km).toFixed(1)+' km';$('latestFuel').textContent=n(latest.fuel_efficiency).toFixed(1)+' km/L'}$('dailyBody').innerHTML=[...ops].reverse().map(r=>`<tr><td>${r.op_date}</td><td>${r.day_type||''}</td><td>${r.start_time||'—'}–${r.end_time||'—'}</td><td>${money(r.total_cash_revenue)}</td><td>${n(r.platform_trips)+n(r.non_platform_trips)}</td><td>${r.business_km??'—'}</td><td>${r.fuel_efficiency??'—'}</td><td>${r.operating_net_income==null?'—':money(r.operating_net_income)}</td><td>${r.net_hourly==null?'—':money(r.net_hourly)}</td><td>${r.notes||''}</td></tr>`).join('');$('expenseBody').innerHTML=exp.map(r=>`<tr><td>${r.expense_date}</td><td>${r.category}</td><td>${money(r.amount)}</td><td>${r.liters??'—'}</td><td>${r.unit_price??'—'}</td><td>${r.odometer??'—'}</td><td>${r.notes||''}</td></tr>`).join('');const months=[...new Set(ops.map(r=>r.op_date.slice(0,7)))].sort(),stats=months.map(m=>{const rs=ops.filter(r=>r.op_date.startsWith(m));const income=rs.reduce((s,r)=>s+n(r.total_cash_revenue),0);const feeRec=recon.find(r=>String(r.month).startsWith(m));const fee=n(feeRec?.actual_platform_fee??rs.reduce((s,r)=>s+n(r.estimated_platform_fee),0));const fuel=exp.filter(e=>e.expense_date.startsWith(m)&&(e.category==='fuel'||e.category==='加油')).reduce((s,e)=>s+n(e.amount),0);const other=exp.filter(e=>e.expense_date.startsWith(m)&&e.category!=='fuel'&&e.category!=='加油').reduce((s,e)=>s+n(e.amount),0);const fix=fixed.reduce((s,c)=>{const active=(!c.start_date||c.start_date<=m+'-31')&&(!c.end_date||c.end_date>=m+'-01');return s+(active?(c.cadence==='yearly'?n(c.amount)/12:n(c.amount)):0)},0);return{m,income,cost:fee+fuel+other+fix,profit:income-fee-fuel-other-fix}});$('monthlyBody').innerHTML=[...stats].reverse().map(x=>`<div class="card"><div class="label">${x.m}</div><div class="value">${money(x.profit)}</div><div class="muted">收入 ${money(x.income)}｜成本 ${money(x.cost)}</div></div>`).join('');if(chart1)chart1.destroy();chart1=new Chart($('revenueChart'),{type:'line',data:{labels:ops.map(r=>r.op_date.slice(5)),datasets:[{label:'每日總實收',data:ops.map(r=>n(r.total_cash_revenue))}]},options:{responsive:true,maintainAspectRatio:false}});if(chart2)chart2.destroy();chart2=new Chart($('monthlyChart'),{type:'bar',data:{labels:stats.map(x=>x.m.slice(5)+'月'),datasets:[{label:'總實收',data:stats.map(x=>x.income)},{label:'總成本',data:stats.map(x=>x.cost)},{label:'月淨利',data:stats.map(x=>x.profit)}]},options:{responsive:true,maintainAspectRatio:false}});$('dataStatus').classList.add('hidden');showTab('dashboard')}catch(e){$('dataStatus').classList.remove('hidden');$('dataStatus').textContent='資料讀取失敗：'+e.message}finally{loading=false}}async function init(){try{$('loadingPanel').classList.remove('hidden');$('loginPanel').classList.add('hidden');$('appPanel').classList.add('hidden');const session=await requireSession();$('loadingPanel').classList.add('hidden');if(!session){$('loginPanel').classList.remove('hidden');return}if((session.user?.email||'').toLowerCase()!==OWNER){await sb.auth.signOut();$('loginPanel').classList.remove('hidden');$('loginMsg').className='msg err';$('loginMsg').textContent='此帳號沒有權限';return}$('appPanel').classList.remove('hidden');await new Promise(r=>setTimeout(r,250));await loadData(session)}catch(e){$('loadingPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('loginMsg').className='msg err';$('loginMsg').textContent='登入狀態失效：'+e.message}}sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)setTimeout(init,100);if(event==='TOKEN_REFRESHED'&&session&&!loading)setTimeout(()=>loadData(session),100);if(event==='SIGNED_OUT')location.reload()});init();})();</script></body></html>
