<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的多元計程車營運總覽</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;font-family:system-ui;background:#0b1220;color:#eef2f7}.hidden{display:none!important}.login{max-width:430px;margin:11vh auto;padding:26px;background:#131c2e;border:1px solid #2b3850;border-radius:20px}.login input,.login button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;margin:8px 0}.login input{background:#0f172a;color:white;border:1px solid #2b3850}.login button{border:0;font-weight:800;cursor:pointer}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#064e3b}.err{background:#7f1d1d}.wrap{max-width:1180px;margin:auto;padding:18px}header{border-bottom:1px solid #2b3850;background:#101827}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav button,.logout{padding:9px 13px;border:1px solid #2b3850;border-radius:10px;background:#0f172a;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.card{background:#131c2e;border:1px solid #2b3850;border-radius:16px;padding:16px}.label{font-size:12px;color:#93a4ba}.value{font-size:25px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto;margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #2b3850;white-space:nowrap;text-align:left}.muted{color:#93a4ba;font-size:12px}.chartbox{margin-top:18px;background:#131c2e;border:1px solid #2b3850;border-radius:16px;padding:16px;height:290px}.chartbox h3{margin:0 0 10px;font-size:15px}</style></head><body><div id="loginPanel" class="login"><h2>🚕 我的多元計程車營運總覽</h2><p class="muted">登入後才能查看私人營運資料</p><input id="emailInput" type="email" value="ac960322@gmail.com"><button id="magicBtn" type="button">寄送登入連結</button><div id="loginMsg"></div></div><div id="appPanel" class="hidden"><header><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>🚕 我的多元計程車營運總覽</b><div class="muted">私人帳本・正式 Supabase</div></div><button id="logoutBtn" class="logout">登出</button></div><div class="nav"><button data-tab="dashboard">儀表板</button><button data-tab="daily">每日紀錄</button><button data-tab="expenses">車輛支出</button><button data-tab="monthly">月度損益</button></div></div></header><main class="wrap"><section id="dashboard"><div class="grid"><div class="card"><div class="label">最新總實收</div><div id="latestRevenue" class="value">—</div></div><div class="card"><div class="label">最新淨收入</div><div id="latestNet" class="value">—</div></div><div class="card"><div class="label">最新淨時薪</div><div id="latestHourly" class="value">—</div></div><div class="card"><div class="label">最新單數</div><div id="latestTrips" class="value">—</div></div><div class="card"><div class="label">最新營業里程</div><div id="latestKm" class="value">—</div></div><div class="card"><div class="label">最新油耗</div><div id="latestFuel" class="value">—</div></div></div><div class="grid"><div class="card"><div class="label">本月總實收</div><div id="monthRevenue" class="value">—</div></div><div class="card"><div class="label">本月營業天數</div><div id="monthDays" class="value">—</div></div><div class="card"><div class="label">平日平均淨時薪</div><div id="weekdayHourly" class="value">—</div></div><div class="card"><div class="label">假日平均淨時薪</div><div id="holidayHourly" class="value">—</div></div></div><div class="chartbox"><h3>每日總實收趨勢</h3><canvas id="revenueChart"></canvas></div><div class="chartbox"><h3>平日 vs 假日平均淨時薪</h3><canvas id="hourlyChart"></canvas></div><div class="chartbox"><h3>本月收入與主要成本比較</h3><canvas id="costChart"></canvas></div></section><section id="daily" class="hidden"><h3>每日營運紀錄</h3><div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>日別</th><th>時間</th><th>總實收</th><th>單數</th><th>里程</th><th>油耗</th><th>淨收入</th><th>淨時薪</th><th>備註</th></tr></thead><tbody id="dailyBody"></tbody></table></div></section><section id="expenses" class="hidden"><h3>車輛支出</h3><div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>類別</th><th>實付</th><th>公升</th><th>單價</th><th>油槍金額</th><th>里程</th><th>備註</th></tr></thead><tbody id="expenseBody"></tbody></table></div></section><section id="monthly" class="hidden"><h3>月度損益</h3><div id="monthlyBody" class="grid"></div></section></main></div><script>(()=>{'use strict';const SB_URL='https://drtcwtexgpfliafozoel.supabase.co';const SB_KEY='sb_publishable_QUlgRpzRqe-5GLzFLfi4iw_M4w2U0Wj';const OWNER='ac960322@gmail.com';const client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const money=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(v||0));const n=v=>Number(v||0);let charts={};function showTab(id){['dashboard','daily','expenses','monthly'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));$('magicBtn').addEventListener('click',async()=>{const email=$('emailInput').value.trim();const msg=$('loginMsg');if(email!==OWNER){msg.className='msg err';msg.textContent='此網站只允許指定帳號登入';return}msg.className='msg';msg.textContent='寄送中…';const redirectTo='https://ac960322-jpg.github.io/my-taxi-ops-dashboard/';const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});if(error){msg.className='msg err';msg.textContent='寄送失敗：'+error.message}else{msg.className='msg ok';msg.textContent='登入信已寄出，請到 Gmail 點最新一封登入連結。'}});$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});function drawChart(id,type,labels,data,label){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),{type,data:{labels,datasets:[{label,data}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#eef2f7'}}},scales:{x:{ticks:{color:'#93a4ba'},grid:{color:'#223047'}},y:{ticks:{color:'#93a4ba'},grid:{color:'#223047'}}}}})}async function loadData(){const [oq,eq,fq,rq]=await Promise.all([client.from('daily_operations').select('*').order('op_date',{ascending:true}),client.from('vehicle_expenses').select('*').order('expense_date',{ascending:false}),client.from('fixed_costs').select('*').order('id'),client.from('monthly_reconciliation').select('*').order('month')]);const error=oq.error||eq.error||fq.error||rq.error;if(error){alert('資料讀取失敗：'+error.message);return}const ops=oq.data||[],exp=eq.data||[],fixed=fq.data||[],recon=rq.data||[];const latest=ops.at(-1);if(latest){$('latestRevenue').textContent=money(latest.total_cash_revenue);$('latestNet').textContent=money(latest.operating_net_income);$('latestHourly').textContent=latest.net_hourly==null?'—':money(latest.net_hourly)+'/hr';$('latestTrips').textContent=(n(latest.platform_trips)+n(latest.non_platform_trips))+' 趟';$('latestKm').textContent=n(latest.business_km).toFixed(1)+' km';$('latestFuel').textContent=n(latest.fuel_efficiency).toFixed(1)+' km/L'}const activeMonth=latest?latest.op_date.slice(0,7):new Date().toISOString().slice(0,7);const rows=ops.filter(r=>r.op_date.slice(0,7)===activeMonth);$('monthRevenue').textContent=money(rows.reduce((s,r)=>s+n(r.total_cash_revenue),0));$('monthDays').textContent=rows.length+' 天';let wa=null,ha=null;for(const [kind,id] of [['weekday','weekdayHourly'],['holiday','holidayHourly']]){const a=rows.filter(r=>(r.day_type===kind||(kind==='weekday'&&r.day_type==='平日')||(kind==='holiday'&&r.day_type==='假日'))&&r.net_hourly!=null);const avg=a.length?a.reduce((s,r)=>s+n(r.net_hourly),0)/a.length:null;$(id).textContent=avg==null?'—':money(avg);if(kind==='weekday')wa=avg;else ha=avg}$('dailyBody').innerHTML=[...ops].reverse().map(r=>`<tr><td>${r.op_date}</td><td>${r.day_type||''}</td><td>${r.start_time||'—'}–${r.end_time||'—'}</td><td>${money(r.total_cash_revenue)}</td><td>${n(r.platform_trips)+n(r.non_platform_trips)}</td><td>${r.business_km??'—'}</td><td>${r.fuel_efficiency??'—'}</td><td>${money(r.operating_net_income)}</td><td>${r.net_hourly==null?'—':money(r.net_hourly)}</td><td>${r.notes||''}</td></tr>`).join('');$('expenseBody').innerHTML=exp.map(r=>`<tr><td>${r.expense_date}</td><td>${r.category}</td><td>${money(r.amount)}</td><td>${r.liters??'—'}</td><td>${r.unit_price??'—'}</td><td>${r.pump_amount??'—'}</td><td>${r.odometer??'—'}</td><td>${r.notes||''}</td></tr>`).join('');const months=[...new Set(ops.map(r=>r.op_date.slice(0,7)))].sort().reverse();$('monthlyBody').innerHTML=months.map(m=>{const rs=ops.filter(r=>r.op_date.startsWith(m));const income=rs.reduce((s,r)=>s+n(r.total_cash_revenue),0);const feeRec=recon.find(r=>String(r.month).startsWith(m));const fee=feeRec?.actual_platform_fee??rs.reduce((s,r)=>s+n(r.estimated_platform_fee),0);const fuel=exp.filter(e=>e.expense_date.startsWith(m)&&(e.category==='fuel'||e.category==='加油')).reduce((s,e)=>s+n(e.amount),0);const other=exp.filter(e=>e.expense_date.startsWith(m)&&e.category!=='fuel'&&e.category!=='加油').reduce((s,e)=>s+n(e.amount),0);const fix=fixed.reduce((s,c)=>s+(c.cadence==='yearly'?n(c.amount)/12:n(c.amount)),0);const profit=income-n(fee)-fuel-other-fix;return `<div class="card"><div class="label">${m.replace('-',' / ')}</div><div class="value">${money(profit)}</div><div class="muted">收入 ${money(income)}｜平台 ${money(fee)}｜加油 ${money(fuel)}｜其他 ${money(other)}｜固定 ${money(fix)}</div></div>`}).join('');const feeRec=recon.find(r=>String(r.month).startsWith(activeMonth));const fee=feeRec?.actual_platform_fee??rows.reduce((s,r)=>s+n(r.estimated_platform_fee),0);const fuel=exp.filter(e=>e.expense_date.startsWith(activeMonth)&&(e.category==='fuel'||e.category==='加油')).reduce((s,e)=>s+n(e.amount),0);const other=exp.filter(e=>e.expense_date.startsWith(activeMonth)&&e.category!=='fuel'&&e.category!=='加油').reduce((s,e)=>s+n(e.amount),0);const fix=fixed.reduce((s,c)=>s+(c.cadence==='yearly'?n(c.amount)/12:n(c.amount)),0);drawChart('revenueChart','line',rows.map(r=>r.op_date.slice(5)),rows.map(r=>n(r.total_cash_revenue)),'每日總實收');drawChart('hourlyChart','bar',['平日','假日'],[wa||0,ha||0],'平均淨時薪');drawChart('costChart','bar',['總實收','平台抽成','實際加油','其他支出','固定成本'],[rows.reduce((s,r)=>s+n(r.total_cash_revenue),0),n(fee),fuel,other,fix],'金額')}async function init(){const {data,error}=await client.auth.getSession();if(error){$('loginMsg').className='msg err';$('loginMsg').textContent='登入狀態讀取失敗：'+error.message;return}const session=data.session;if(!session){$('loginPanel').classList.remove('hidden');$('appPanel').classList.add('hidden');return}if((session.user.email||'').toLowerCase()!==OWNER){await client.auth.signOut();$('loginMsg').className='msg err';$('loginMsg').textContent='此帳號沒有權限';return}$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');showTab('dashboard');await loadData()}client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)init();if(event==='SIGNED_OUT')init()});init();})();</script></body></html>
