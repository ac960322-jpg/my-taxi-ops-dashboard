<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的多元計程車營運總覽</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e5e7eb}header{padding:20px;background:#111827;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#1f2937;border-radius:16px;padding:16px}.label{font-size:13px;color:#94a3b8}.value{font-size:28px;font-weight:700;margin-top:8px}.hidden{display:none}.login{max-width:420px;margin:10vh auto;background:#1f2937;padding:24px;border-radius:18px}.login input{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #374151;background:#111827;color:white}.login button,.logout{width:100%;padding:12px;border:0;border-radius:10px;background:#e5e7eb;color:#111827;font-weight:700;cursor:pointer}.section{margin-top:20px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:10px;border-bottom:1px solid #374151;white-space:nowrap}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{padding:9px 12px;border-radius:10px;border:1px solid #374151;background:#111827;color:#e5e7eb;cursor:pointer}.err{background:#7f1d1d;padding:10px;border-radius:10px;margin-top:10px}.ok{background:#064e3b;padding:10px;border-radius:10px;margin-top:10px}canvas{background:#111827;border-radius:14px;padding:10px}</style></head><body><div id="login" class="login"><h2>🚕 我的多元計程車營運總覽</h2><p class="label">登入後才能查看私人營運資料</p><input id="email" type="email" value="ac960322@gmail.com" placeholder="Email"><button onclick="sendMagicLink()">寄送登入連結</button><div id="loginMsg"></div></div><div id="app" class="hidden"><header><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><strong>🚕 我的多元計程車營運總覽</strong><div class="label">私人帳本・Supabase</div></div><button class="logout" style="width:auto" onclick="signOut()">登出</button></div></header><main><div class="nav"><button onclick="showTab('dashboard')">總覽</button><button onclick="showTab('daily')">每日紀錄</button><button onclick="showTab('expenses')">車輛支出</button></div><section id="dashboard"><div class="grid"><div class="card"><div class="label">最新營業日總實收</div><div id="latestRevenue" class="value">—</div></div><div class="card"><div class="label">最新營業日淨收入</div><div id="latestNet" class="value">—</div></div><div class="card"><div class="label">淨時薪</div><div id="latestHourly" class="value">—</div></div><div class="card"><div class="label">單數</div><div id="latestTrips" class="value">—</div></div><div class="card"><div class="label">營業里程</div><div id="latestKm" class="value">—</div></div><div class="card"><div class="label">油耗</div><div id="latestFuel" class="value">—</div></div></div><div class="section card"><div class="label">本月累計營收</div><div id="monthRevenue" class="value">—</div></div><div class="section"><canvas id="revenueChart" height="110"></canvas></div></section><section id="daily" class="hidden"><div class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>總實收</th><th>單數</th><th>里程</th><th>油耗</th><th>淨收入</th><th>淨時薪</th></tr></thead><tbody id="dailyBody"></tbody></table></div></section><section id="expenses" class="hidden"><div class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>類別</th><th>實付</th><th>公升</th><th>油槍金額</th><th>里程</th><th>備註</th></tr></thead><tbody id="expenseBody"></tbody></table></div></section></main></div><script>const SUPABASE_URL='https://drtcwtexgpfliafozoel.supabase.co';const SUPABASE_KEY='sb_publishable_QUlgRpzRqe-5GLzFLfi4iw_M4w2U0Wj';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let chart;const fmt=n=>n==null?'—':new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n));async function sendMagicLink(){const email=document.getElementById('email').value.trim();const m=document.getElementById('loginMsg');if(email!=='ac960322@gmail.com'){m.textContent='此網站只允許指定帳號登入';m.className='err';return}m.textContent='寄送中…';m.className='';const redirectTo=location.origin+location.pathname;const{error}=await supabaseClient.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});if(error){m.textContent='寄送失敗：'+error.message;m.className='err';return}m.textContent='登入信已寄出，請到 Gmail 點登入連結。';m.className='ok'}async function signOut(){await supabaseClient.auth.signOut();location.reload()}function showTab(id){['dashboard','daily','expenses'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}if(session.user.email!=='ac960322@gmail.com'){await supabaseClient.auth.signOut();alert('此帳號沒有權限');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await Promise.all([loadDaily(),loadExpenses()])}async function loadDaily(){const{data,error}=await supabaseClient.from('daily_operations').select('*').order('op_date',{ascending:true});if(error){alert('讀取每日紀錄失敗：'+error.message);return}const latest=data[data.length-1];if(latest){latestRevenue.textContent=fmt(latest.total_cash_revenue);latestNet.textContent=fmt(latest.operating_net_income);latestHourly.textContent=latest.net_hourly?fmt(latest.net_hourly)+'/hr':'—';latestTrips.textContent=(Number(latest.platform_trips||0)+Number(latest.non_platform_trips||0))+' 趟';latestKm.textContent=(latest.business_km??'—')+' km';latestFuel.textContent=(latest.fuel_efficiency??'—')+' km/L'}const now=new Date();const month=data.filter(r=>{const d=new Date(r.op_date+'T00:00:00');return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});monthRevenue.textContent=fmt(month.reduce((s,r)=>s+Number(r.total_cash_revenue||0),0));dailyBody.innerHTML=[...data].reverse().map(r=>`<tr><td>${r.op_date}</td><td>${fmt(r.total_cash_revenue)}</td><td>${Number(r.platform_trips||0)+Number(r.non_platform_trips||0)}</td><td>${r.business_km??''}</td><td>${r.fuel_efficiency??''}</td><td>${fmt(r.operating_net_income)}</td><td>${r.net_hourly?fmt(r.net_hourly):''}</td></tr>`).join('');if(chart)chart.destroy();chart=new Chart(revenueChart,{type:'line',data:{labels:data.map(r=>r.op_date.slice(5)),datasets:[{label:'每日總實收',data:data.map(r=>Number(r.total_cash_revenue||0))}]},options:{responsive:true,plugins:{legend:{labels:{color:'#e5e7eb'}}},scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}}})}async function loadExpenses(){const{data,error}=await supabaseClient.from('vehicle_expenses').select('*').order('expense_date',{ascending:false});if(error){expenseBody.innerHTML=`<tr><td colspan="7">讀取失敗：${error.message}</td></tr>`;return}expenseBody.innerHTML=data.map(r=>`<tr><td>${r.expense_date}</td><td>${r.category}</td><td>${fmt(r.amount)}</td><td>${r.liters??''}</td><td>${r.pump_amount??''}</td><td>${r.odometer??''}</td><td>${r.notes??''}</td></tr>`).join('')}supabaseClient.auth.onAuthStateChange(()=>init());init();</script></body></html>
